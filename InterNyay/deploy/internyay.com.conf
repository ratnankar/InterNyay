server {
    listen 80;
    listen [::]:80;
    server_name internyay.com www.internyay.com internyay.in www.internyay.in internyay.online www.internyay.online internyay.me www.internyay.me;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://internyay.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.internyay.com;
    ssl_certificate /etc/letsencrypt/live/internyay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/internyay.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://internyay.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name internyay.com;
    ssl_certificate /etc/letsencrypt/live/internyay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/internyay.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/internyay/dist;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript text/javascript image/svg+xml application/manifest+json application/xml+rss;

    include /etc/nginx/snippets/internyay-headers.conf;

    error_page 404 /404.html;

    location = /404.html {
        internal;
        include /etc/nginx/snippets/internyay-headers.conf;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/internyay-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /sw.js {
        include /etc/nginx/snippets/internyay-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location ~ ^/workbox-[A-Za-z0-9]+\.js$ {
        include /etc/nginx/snippets/internyay-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/internyay-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/internyay-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = / {
        try_files /index.html =404;
        include /etc/nginx/snippets/internyay-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location ~ ^/(home|login|register|forgot-password|dashboard|cases|clients|transactions|expenses|notifications|documents|miscapps|misc-applications|forms|todos|calculator|quickaccess|quick-access|judgeleave|judges-on-leave|contact|profile|myplan|my-plan|admin)(/.*)?$ {
        try_files /index.html =404;
        include /etc/nginx/snippets/internyay-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
    }

    location / {
        try_files $uri =404;
        include /etc/nginx/snippets/internyay-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }
}
