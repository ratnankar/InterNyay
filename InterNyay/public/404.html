<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a1628" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found · InterNyay</title>
    <!-- Served by the host with a real 404 status for any address the app has no page for (see vite.config.js). Plain HTML, no scripts.
         Keep the look in step with src/styles/pages/errorpage.css -->
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; color: #1a1a2e;
             font-family: 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
             background: linear-gradient(180deg, rgba(10, 22, 40, .06) 0, transparent 280px), #f4f7fb; }
      header { padding: 14px 24px; background: linear-gradient(135deg, #0a1628 0%, #0d2347 100%); box-shadow: 0 2px 10px -4px rgba(10, 22, 40, .4); }
      header a { color: #fff; text-decoration: none; font: 700 1.5rem Georgia, 'Times New Roman', serif; }
      header a:hover { color: #C9A84C; }
      main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px 48px; }
      .card { width: 100%; max-width: 520px; text-align: center; padding: 40px 28px 32px; background: #fff;
              border: 1px solid #dde4ee; border-radius: 20px; box-shadow: 0 1px 2px rgba(10, 22, 40, .06), 0 14px 30px -12px rgba(10, 22, 40, .2);
              animation: rise .35s ease-out both; }
      .icon { display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; margin-bottom: 8px; border-radius: 50%;
              background: #fdf6e3; color: #C9A84C; box-shadow: 0 0 0 6px rgba(201, 168, 76, .1); }
      .icon svg { width: 27px; height: 27px; fill: currentColor; }
      .code { margin: 0 auto; font: 700 clamp(3.5rem, 14vw, 5.5rem)/1 Georgia, 'Times New Roman', serif; color: #0a1628; letter-spacing: .04em; }
      .code::after { content: ''; display: block; width: 44px; height: 3px; margin: 14px auto 0; border-radius: 3px; background: #C9A84C; }
      h1 { margin: 14px 0 8px; font-size: 1.75rem; color: #0a1628; }
      p { margin: 0 auto; max-width: 400px; color: #566176; line-height: 1.5; }
      .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; margin-top: 24px; padding: 0 22px; border-radius: 10px;
             background: #C9A84C; color: #0a1628; font-weight: 700; text-decoration: none; }
      .btn:hover { filter: brightness(1.05); }
      .btn:focus-visible { outline: 2px solid #0a1628; outline-offset: 2px; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
      @media (max-width: 480px) { header { padding: 12px 16px; } .card { padding: 32px 18px 24px; } .btn { width: 100%; } }
    </style>
  </head>
  <body>
    <header><a href="/">InterNyay</a></header>
    <main>
      <div class="card" role="alert">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M9.5 3A6.5 6.5 0 0 1 16 9.5c0 1.61-.59 3.09-1.56 4.23l.27.27h.79l5 5-1.5 1.5-5-5v-.79l-.27-.27A6.52 6.52 0 0 1 9.5 16 6.5 6.5 0 0 1 3 9.5 6.5 6.5 0 0 1 9.5 3m0 2C7 5 5 7 5 9.5S7 14 9.5 14 14 12 14 9.5 12 5 9.5 5"/></svg>
        </span>
        <p class="code" aria-hidden="true">404</p>
        <h1>Page not found</h1>
        <p>The link you followed is broken or the page has moved. Check the address for typing mistakes, or go back to the home page.</p>
        <a class="btn" href="/">Go to home page</a>
      </div>
    </main>
  </body>
</html>
