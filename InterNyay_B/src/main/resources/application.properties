# Port the backend runs on
server.port=8080

# MySQL, the one database for all data (files themselves are kept in file storage, see below)
# DB_URL sets the database address; without it the local MySQL is used. In production set it to the RDS endpoint
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/internyay}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database schema: Flyway owns it. On every start Flyway applies any new file from src/main/resources/db/migration
# (V1__create_schema.sql, V2__..., in version order) and records it in the flyway_schema_history table.
# Hibernate only VALIDATES: it checks that the tables match the entities and refuses to start if they do not, it never
# changes the schema. It is fixed on purpose (no DDL_AUTO switch), so no environment can turn on 'update' by accident.
# To change the schema, add a new migration file, see sql/README.md. Never edit a file that has already been applied.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# The database must be empty (see sql/create_database.sql) or already managed by Flyway. A schema that has tables but no
# flyway_schema_history is refused on purpose, so a half-built database is never silently adopted.
# Refuse to start when an applied migration file was edited afterwards (checksum), and never allow 'flyway clean' (drops everything)
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File storage for uploaded documents, PDFs and notification files. The database keeps only each file's key.
# STORAGE_TYPE=local keeps files in a folder on disk, STORAGE_TYPE=s3 uses a private S3 compatible bucket
# (AWS S3, Cloudflare R2, DigitalOcean Spaces, MinIO). See docs/STORAGE_SETUP.md
internyay.storage.type=${STORAGE_TYPE:local}
internyay.storage.local-dir=${STORAGE_LOCAL_DIR:./data/uploads}
internyay.storage.s3.bucket=${S3_BUCKET:}
internyay.storage.s3.region=${S3_REGION:us-east-1}
# Only for non-AWS providers, e.g. https://<account>.r2.cloudflarestorage.com
internyay.storage.s3.endpoint=${S3_ENDPOINT:}
# Leave the keys empty on AWS to use the server's IAM role
internyay.storage.s3.access-key=${S3_ACCESS_KEY:}
internyay.storage.s3.secret-key=${S3_SECRET_KEY:}
# true for MinIO and some other providers
internyay.storage.s3.path-style=${S3_PATH_STYLE:false}

# JWT secret and how long a login token stays valid.
# JWT_SECRET has no default on purpose: the app refuses to start without it instead of using a known key
internyay.jwt.secret=${JWT_SECRET}
# Sliding session: a token is valid for 10 days (864000000 ms). Any request made with a token older than refresh-after-ms
# gets a fresh token back in the X-Refreshed-Token header, so 10 days without any request signs the user out.
# 0 = tokens never expire
internyay.jwt.expiration-ms=${JWT_EXPIRATION_MS:864000000}
# How old a token must be before it is renewed (default 1 day)
internyay.jwt.refresh-after-ms=${JWT_REFRESH_AFTER_MS:86400000}

# Secret for the one-time POST /api/admin/setup endpoint (header X-Admin-Setup-Key).
# Never commit it. Needs 32+ characters, empty or shorter keeps the endpoint switched off
internyay.admin.setup-key=${INTERNYAY_ADMIN_SETUP_KEY:}

# Frontend URLs allowed to call the API
internyay.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# The paid eCourts API is no longer used. Case details, hearing history and orders are read from the eCourts Services
# portal (cnr.portal.* / causelist.district.*); the order number of a hearing date is looked up there too, in the
# background, whenever a hearing date is set or moved (needs the automatic CAPTCHA reader, captcha.solver.*)

# Judges on Leave: when the district court websites are scraped (Asia/Kolkata time, Spring cron: second minute hour day month weekday).
# Default: every hour, on the hour. The list is also refreshed once whenever the app starts.
judgeleave.scrape.cron=0 0 * * * *

# Cause list numbers are looked up by the hourly causelist.auto.* runs below (they replace the old 7:18 PM and 9:30 PM jobs)

# Delhi High Court cause list PDFs: item numbers are read from the court's published PDFs instead of the eCourts API
causelist.delhihc.enabled=true
causelist.delhihc.court-name=Delhi High Court
causelist.delhihc.archive-url=https://delhihighcourt.nic.in/web/cause-lists-archived
causelist.delhihc.pages-back=3
causelist.delhihc.max-pdf-mb=60

# Supreme Court of India cause list PDFs, published at {base-url}{yyyy-MM-dd}/{prefix}{n}.pdf (M_J_ main list, M_S_ supplementary).
# The court usually publishes after 8 PM, so a second run at 9:30 PM picks up the cases the 7:18 PM run could not find.
# Every n from 1 to max-files is tried for each prefix; missing files are skipped.
causelist.sci.enabled=true
causelist.sci.court-name=Supreme Court of India
causelist.sci.base-url=https://api.sci.gov.in/jonew/cl/
causelist.sci.file-prefixes=M_J_,M_S_
causelist.sci.max-files=6
causelist.sci.max-pdf-mb=60

# Automatic cause list lookup for the next hearing date: every hour from 5 PM to 11 PM (Asia/Kolkata), plus 12 AM for the
# day that has just begun. Each run only looks up cases that still have no number. Use cron "-" to switch a schedule off
causelist.auto.enabled=true
causelist.auto.cron=0 0 17-23 * * *
causelist.auto.midnight.enabled=true
causelist.auto.midnight.cron=0 0 0 * * *
# A run stops after this many minutes (at most 55) so it never overlaps the next hourly run
causelist.auto.max-minutes=50
# Days the cause list run log (Admin > Cause List) is kept
causelist.log.keep-days=45

# Next hearing date update: from 5 PM to 11 PM on the hearing date, and again at 12 AM, every case that still has that date
# as its next hearing is looked up on the eCourts portal and moved to the new date once the court has put it up.
# Cases still not updated are simply tried again at the next run. Needs the automatic CAPTCHA reader (captcha.solver.*)
nexthearing.update.enabled=true
nexthearing.update.cron=0 0 17-23 * * *
nexthearing.update.midnight.cron=0 0 0 * * *
nexthearing.update.startup-catchup=true
# Pause between two cases so the portal is not hammered, and the longest a run may take (it must end before the next hourly run)
nexthearing.update.delay-ms=1500
nexthearing.update.max-minutes=50

# District court cause lists: read from the eCourts Services portal while an admin types the CAPTCHA (Admin > Cause List)
causelist.district.base-url=https://services.ecourts.gov.in/ecourtindia_v6/
causelist.district.state-code=26
causelist.district.session-ttl-minutes=10
# With the CAPTCHA service on, one request reads CAPTCHAs for this many seconds, then the admin page asks again (keeps nginx from timing out)
causelist.district.auto-budget-seconds=20
causelist.district.path.districts=casestatus/fillDistrict
causelist.district.path.complexes=casestatus/fillcomplex
causelist.district.path.establishments=casestatus/fillCourtEstablishment
causelist.district.path.courts=cause_list/fillCauseList
causelist.district.path.submit=cause_list/submitCauseList

# Fetch missing numbers when the app starts
ecourts.api.startup-catchup=false

# Gmail SMTP for OTP and notification emails
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# OTP settings: sender name, expiry, resend cooldown and wrong attempts allowed
internyay.otp.from-name=InterNyay
internyay.otp.expiry-minutes=10
internyay.otp.verified-window-minutes=30
internyay.otp.resend-cooldown-seconds=45
internyay.otp.max-attempts=5

# When true the OTP is not emailed, useful while developing
internyay.otp.dry-run=${OTP_DRY_RUN:false}

# Google sign-in client id
internyay.google.client-id=${GOOGLE_CLIENT_ID:}

# Also reads .env and local-secrets.properties when they exist
spring.config.import=optional:file:./.env[.properties],optional:file:./local-secrets.properties

# Maximum upload size
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Send error details so the frontend can show them
server.error.include-message=always
server.error.include-binding-errors=always

# Log levels
# DEBUG logs more detail than a live server should keep, set LOG_LEVEL=DEBUG only while investigating
logging.level.com.internyay=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN

# WhatsApp Cloud API credentials
whatsapp.api.base-url=https://graph.facebook.com/v25.0
whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.api.token=${WHATSAPP_TOKEN:}

# Message templates and country code added to numbers
whatsapp.template.language=en
whatsapp.template.hearing-reminder=internyay_hearing_reminder
whatsapp.template.payment-due=internyay_payment_due
whatsapp.default-country-code=91

# When true messages are only logged, not sent
whatsapp.dry-run=${WHATSAPP_DRY_RUN:false}

# Daily reminder time, 10 AM
whatsapp.reminder.cron=0 0 10 * * *

# Chat assistant: OpenAI compatible endpoint and model
internyay.chat.base-url=${CHAT_BASE_URL:}
internyay.chat.model=${CHAT_MODEL:}
internyay.chat.api-key=${CHAT_API_KEY:}

# Limits for one reply, tool calls and timeout
internyay.chat.max-tokens=3072
internyay.chat.max-tool-rounds=8
internyay.chat.max-tool-result-chars=14000
internyay.chat.timeout-seconds=600

# Contact form limit per email each hour
internyay.contact.max-per-hour=5

spring.jpa.open-in-view=false

# Behind a reverse proxy / load balancer set FORWARD_HEADERS_STRATEGY=native so the rate limits below see each user's real IP
# (otherwise every user shares the proxy's address). Leave it at none when the backend is reached directly,
# because with native a client could fake X-Forwarded-For
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Rate limiting per client IP (token bucket). Each rule allows <capacity> requests per <window-minutes>.
internyay.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
# Email + password login (the per-email wrong-password lock in AuthService still applies on top)
internyay.rate-limit.login.capacity=10
internyay.rate-limit.login.window-minutes=15
# Google sign-in and Google registration
internyay.rate-limit.google.capacity=20
internyay.rate-limit.google.window-minutes=15
# Sending a code by email: registration, forgot password, email change (costs money and can spam a victim)
internyay.rate-limit.otp-send.capacity=5
internyay.rate-limit.otp-send.window-minutes=15
# Checking a code or resetting a password with one (stops guessing codes from many accounts)
internyay.rate-limit.otp-verify.capacity=10
internyay.rate-limit.otp-verify.window-minutes=15


# CAPTCHA service (captcha-service/): reads the eCourts CAPTCHA image so the advocate does not type it. When it is off,
# down or cannot read an image, the advocate types the CAPTCHA as before. See docs/CAPTCHA_SETUP.md
captcha.solver.enabled=${CAPTCHA_SOLVER_ENABLED:true}
captcha.solver.url=${CAPTCHA_SOLVER_URL:http://127.0.0.1:8001}
captcha.solver.key=${CAPTCHA_SOLVER_KEY:}
captcha.solver.timeout-ms=4000
captcha.solver.max-attempts=4

# Add Case by CNR: the case is read from the eCourts Services portal (case status by CNR) while the advocate types the
# CAPTCHA the portal shows. Same portal address as the district cause lists (causelist.district.base-url)
# Page addresses (the portal's ?p= value) tried in turn until one gives a session. The CNR search form lives on the case status page
cnr.portal.page=casestatus/index,cnr_status/index
cnr.portal.path.search=cnr_status/searchByCNR/
cnr.portal.path.display-pdf=home/display_pdf
# How long a lookup waits to be saved as a case before it is dropped
cnr.portal.session-ttl-minutes=30
# Pause between two order downloads of one case, so the portal is not hammered
cnr.portal.order-delay-ms=2000
# Orders of one lookup are kept in memory until the case is saved; the most that is kept
cnr.portal.max-staged-mb=80
